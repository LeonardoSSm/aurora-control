[package]
name = "aurora-control"
version = "0.3.1"
description = "Indicadores de utilização de ferramentas de IA"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "~2.4.0"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "~2.11.5", features = ["tray-icon", "test"] }
serde_json = "1"
