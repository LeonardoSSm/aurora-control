[package]
name = "aurora-control"
version = "0.1.0"
description = "Indicadores de utilização de ferramentas de IA"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.5", features = ["tray-icon"] }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1"
